name: CI
on:
  push: { branches: [master] }
  pull_request: { types: [opened, synchronize, reopened, ready_for_review], branches: [master] }
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  fmt:
    uses: DioxusLabs/dioxus-ci/.github/workflows/fmt.yml@main

